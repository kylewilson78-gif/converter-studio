<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Converter">
  <meta name="description" content="Convert 150+ file types, edit photos, clean audio, split stems, turn audio into MIDI and write AI .md files. On your device.">
  <title>Converter Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button id="backBtn" class="iconbtn" aria-label="Back to home" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <h1 id="title">Converter Studio</h1>
    <button id="settingsBtn" class="iconbtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-home" class="view" aria-labelledby="title">
      <p class="lede">Pick a tool. Everything runs on your device.</p>
      <ul class="tiles" role="list">
        <li><button class="tile t-convert" data-go="convert">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
          <span class="tname">Convert</span><span class="tdesc">150+ formats, batches</span>
        </button></li>
        <li><button class="tile t-image" data-go="image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>
          <span class="tname">Image</span><span class="tdesc">Edit, remove BG, to JSON</span>
        </button></li>
        <li><button class="tile t-audio" data-go="audio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10"/></svg>
          <span class="tname">Audio</span><span class="tdesc">Clean, effects, AI stems</span>
        </button></li>
        <li><button class="tile t-midi" data-go="midi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v10M12 4v10M16 4v10M6 14h4M14 14h4"/></svg>
          <span class="tname">MIDI</span><span class="tdesc">Hum, play, beatbox → .mid</span>
        </button></li>
        <li><button class="tile t-md" data-go="md">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
          <span class="tname">.md</span><span class="tdesc">Prompts, skills, rules</span>
        </button></li>
        <li><button class="tile t-video" data-soon="The multitrack video editor, captions and 4K upscaling are step 5. Video conversion, trimming and TikTok/Reels presets already live in Convert.">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>
          <span class="tname">Video</span><span class="tdesc">Editor, captions, 4K</span><span class="soon">Step 5</span>
        </button></li>
      </ul>
    </section>
    <section id="view-tool" class="view" hidden></section>
  </main>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
